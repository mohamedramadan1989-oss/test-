<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daghta - أنشئ متجرك الإلكتروني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { background-color: #070a12; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; direction: rtl; text-align: right; }
        
        .store-card { background: #0f172a; color: #f8fafc; padding: 40px 35px; border-radius: 24px; width: 550px; max-width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.7); border: 1px solid #1e293b; position: relative; }
        .store-logo { width: 130px; height: auto; object-fit: contain; margin: 0 auto 20px; display: block; filter: brightness(0) invert(1); }
        .store-title { font-size: 24px; font-weight: 900; color: #ffffff; margin-bottom: 8px; text-align: center; }
        .store-subtitle { font-size: 13px; color: #94a3b8; font-weight: 600; margin-bottom: 30px; text-align: center; }

        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; font-size: 13px; font-weight: 800; color: #cbd5e1; margin-bottom: 6px; }
        .input-box input, .input-box select { width: 100%; padding: 13px 16px; border: 1.5px solid #334155; border-radius: 12px; font-size: 14px; outline: none; background: #1e293b; color: #fff; text-align: right; }
        .input-box input:focus, .input-box select:focus { border-color: #38bdf8; background: #0f172a; box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }

        .btn-launch { width: 100%; padding: 15px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(56,189,248,0.3); margin-top: 15px; }
        .btn-launch:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(56,189,248,0.5); }

        .back-home { position: absolute; top: 20px; right: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .back-home:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="store-card">
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
        
        <img src="Daghta_Arabic.png" class="store-logo" alt="Daghta">
        <div class="store-title">أنشئ متجرك الإلكتروني الفوري</div>
        <div class="store-subtitle">اكتب تفاصيل براندك وابدأ في استقبال طلباتك فوراً.</div>

        <div class="input-box">
            <label>اسم المتجر / البراند</label>
            <input type="text" id="storeName" placeholder="مثال: متجر حلا للاكسسوارات">
        </div>

        <div class="input-box">
            <label>العملة المفضلة</label>
            <select id="storeCurrency">
                <option value="EGP">جنيه مصري (EGP)</option>
                <option value="SAR">ريال سعودي (SAR)</option>
                <option value="AED">درهم إماراتي (AED)</option>
                <option value="USD">دولار أمريكي (USD)</option>
            </select>
        </div>

        <div class="input-box">
            <label>رقم الواتساب (لاستقبال الطلبات)</label>
            <input type="text" id="storePhone" placeholder="مثال: 201012345678+">
        </div>

        <button class="btn-launch" onclick="createArabicStore()">انشئ المتجر الآن 🚀</button>
    </div>

    <script>
        function createArabicStore() {
            const name = document.getElementById('storeName').value.trim();
            const currency = document.getElementById('storeCurrency').value;
            const phone = document.getElementById('storePhone').value.trim();

            if (!name || !phone) {
                alert('الرجاء إدخال اسم المتجر ورقم الواتساب.');
                return;
            }

            localStorage.setItem('daghta_merchant_brand', name);
            localStorage.setItem('daghta_currency', currency);
            localStorage.setItem('daghta_phone', phone);
            
            alert('تم إنشاء المتجر بنجاح! جاري الانتقال لوحة التحكم...');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
